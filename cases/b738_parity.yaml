# =============================================================================================
# Boeing 737-800 -- full mission sizing, flown on cdadt's own aerodynamics
# =============================================================================================
# The same aeroplane and the same mission as b738.yaml, but the drag is cdadt's rather than
# OpenConcept's. Everything else -- the balanced-field takeoff, the Part 25 reserves, the engine
# deck, the weight closure -- is still OpenConcept's, used as published.
#
# What makes the substitution possible is that the black box named here is cdadt's own analysis
# group. OpenConcept's B738_sizing.py hardcodes its aircraft model at the point it builds the
# mission, so the aerodynamics cannot be replaced from outside it; cdadt owns that line instead.
# Nothing in either dependency is modified.
#
#   black_box.model            -> cdadt.adapter.analysis:SizingMissionAnalysis
#   black_box.options.aerodynamic_loads -> which AerodynamicLoads to fly with
#
# Three models ship, and switching between them changes one line and nothing else -- which is the
# point of the abstraction:
#
#   cdadt.models.polar:PolarLoads     the parabolic polar. Deliberately the same equation
#                                     OpenConcept evaluates, so this case reproduces
#                                     run_738_sizing_analysis to 4e-13. That is the anchor: it
#                                     proves the machinery before any new physics rides on it.
#
#   cdadt.adapter.avl:OpenAVLLoads    a vortex lattice, via openavl. Builds the wing below as a
#                                     lattice and fits its drag polar from it, so the induced
#                                     drag comes from the geometry rather than an assumed span
#                                     efficiency. Reads openavl's Trefftz-plane far-field drag,
#                                     which is the physically admissible one on a swept wing.
#                                     Needs: pip install -e ".[avl]"
#
#   cdadt.adapter.oas:OpenAeroStructLoads
#                                     the same idea through OpenConcept's own OpenAeroStruct
#                                     lattice, on a mesh built from the same four wing numbers.
#                                     Reads near-field drag, because that is all its VLM
#                                     publishes, so it runs about 4% optimistic on induced drag.
#                                     Its value is as an independent second opinion: the two
#                                     codes agree to 0.67% compared like for like.
#                                     Needs: pip install -e ".[transonic]"
#
# The two lattices are not interchangeable and docs/truth.rst says exactly how they differ. Having
# both is what makes cdadt's aerodynamics a checkable claim rather than one code's word for it.
# =============================================================================================

black_box:
  model: cdadt.adapter.analysis:SizingMissionAnalysis
  options:
    # The parabolic polar ships as the default here because it needs no optional extra and because
    # it is the anchor. To fly the vortex lattice instead, replace the line below with:
    #
    #   aerodynamic_loads: cdadt.adapter.avl:OpenAVLLoads    # openavl, far-field
    #   aerodynamic_loads: cdadt.adapter.oas:OpenAeroStructLoads   # OpenConcept's own lattice
    #
    # and nothing else in this file changes. `ac|aero|polar|e` below then becomes an unused
    # assumption -- the lattice computes the span efficiency rather than reading it, and reports
    # 0.990 for this wing against the 0.801 stated.
    aerodynamic_loads: cdadt.models.polar:PolarLoads
    # Transonic drag rise, from OpenConcept's own Korn-equation WaveDragFromSections. Off here for
    # the same reason: with it off this case reproduces the reference example, and OpenConcept's own
    # B738AircraftModel has no wave drag either. Turn it on for a study that moves sweep or
    # thickness -- those are the variables whose transonic effect is otherwise missing. It costs
    # 1.8% more fuel on this mission, and needs OpenAeroStruct installed.
    wave_drag: false
  num_nodes: 21          # must be odd: the box integrates fuel burn with Simpson's rule

solver:
  maxiter: 20
  atol: 1.0e-9
  rtol: 1.0e-9
  iprint: -1
  err_on_non_converge: true

# ---------------------------------------------------------------------------------------------
# Design variables
# ---------------------------------------------------------------------------------------------
# Every ac| variable the box publishes, with its value and where the number came from. None is
# freed here: this is a sizing run. See b738_optimization.yaml for the same aeroplane with
# `optimize:` entries added.
design_variables:

  # -------------------- Aerodynamics --------------------
  ac|aero|polar|e:
    value: 0.801
    source: OpenConcept B738 example estimate
  ac|aero|Mach_max:
    value: 0.82
    source: Boeing 737-800 maximum operating Mach
  ac|aero|Vstall_land:
    value: 115
    units: kn
    source: OpenConcept B738_sizing estimate
  ac|aero|airfoil_Cl_max:
    value: 1.75
    source: OpenConcept B738_sizing estimate for a supercritical airfoil
  ac|aero|takeoff_flap_deg:
    value: 15
    units: deg
    source: Boeing 737-800 normal takeoff flap setting

  # -------------------- Propulsion --------------------
  ac|propulsion|engine|rating:
    value: 27.0e3
    units: lbf
    source: CFM56-7B27 sea-level static thrust
  ac|propulsion|num_engines:
    value: 2
    source: Boeing 737-800 configuration

  # -------------------- Wing --------------------
  ac|geom|wing|S_ref:
    value: 124.6
    units: m**2
    source: b737.org.uk technical specifications
  ac|geom|wing|AR:
    value: 9.45
    source: b737.org.uk technical specifications
  ac|geom|wing|c4sweep:
    value: 25
    units: deg
    source: b737.org.uk technical specifications
  ac|geom|wing|taper:
    value: 0.159
    source: b737.org.uk technical specifications
  ac|geom|wing|toverc:
    value: 0.12
    source: OpenConcept B738_sizing estimate

  # -------------------- Horizontal stabilizer --------------------
  # Its area is absent on purpose: the box sizes it from the tail volume coefficient.
  ac|geom|hstab|AR:
    value: 6.16
    source: b737.org.uk technical specifications
  ac|geom|hstab|c4sweep:
    value: 30
    units: deg
    source: b737.org.uk technical specifications
  ac|geom|hstab|taper:
    value: 0.203
    source: b737.org.uk technical specifications
  ac|geom|hstab|toverc:
    value: 0.12
    source: OpenConcept B738_sizing estimate

  # -------------------- Vertical stabilizer --------------------
  ac|geom|vstab|AR:
    value: 1.91
    source: b737.org.uk technical specifications
  ac|geom|vstab|c4sweep:
    value: 35
    units: deg
    source: b737.org.uk technical specifications
  ac|geom|vstab|taper:
    value: 0.271
    source: b737.org.uk technical specifications
  ac|geom|vstab|toverc:
    value: 0.12
    source: OpenConcept B738_sizing estimate

  # -------------------- Fuselage --------------------
  ac|geom|fuselage|length:
    value: 38.08
    units: m
    source: b737.org.uk technical specifications
  ac|geom|fuselage|height:
    value: 3.76
    units: m
    source: b737.org.uk technical specifications

  # -------------------- Nacelle --------------------
  ac|geom|nacelle|length:
    value: 4.3
    units: m
    source: OpenConcept B738_sizing photogrammetry estimate
  ac|geom|nacelle|diameter:
    value: 2
    units: m
    source: OpenConcept B738_sizing photogrammetry estimate

  # -------------------- Landing gear --------------------
  ac|geom|maingear|length:
    value: 1.8
    units: m
    source: OpenConcept B738_sizing estimate
  ac|geom|maingear|num_wheels:
    value: 4
    source: Boeing 737-800 configuration
  ac|geom|maingear|num_shock_struts:
    value: 2
    source: Boeing 737-800 configuration
  ac|geom|nosegear|length:
    value: 1.3
    units: m
    source: OpenConcept B738_sizing estimate
  ac|geom|nosegear|num_wheels:
    value: 2
    source: Boeing 737-800 configuration

  # -------------------- Weights, cabin and occupancy --------------------
  ac|weights|W_payload:
    value: 18.0e3
    units: kg
    source: OpenConcept B738_sizing design payload
  ac|num_passengers_max:
    value: 189
    source: Boeing 737-800 single-class maximum
  ac|num_flight_deck_crew:
    value: 2
    source: Boeing 737-800 configuration
  ac|num_cabin_crew:
    value: 4
    source: Boeing 737-800 configuration
  ac|cabin_pressure:
    value: 8.95
    units: psi
    source: Boeing 737-800 cabin differential

# ---------------------------------------------------------------------------------------------
# Initial conditions
# ---------------------------------------------------------------------------------------------
# The direct counterpart of `set_values(prob, num_nodes)`, with the same names. A two-element
# value is interpolated across the phase, exactly as `np.linspace(2300.0, 400.0, num_nodes)`
# does there; a single value is constant; a full-length list is used as given.
initial_conditions:

  # -------------------- Mission-level --------------------
  mission_range: {value: 2800, units: nmi}
  cruise|h0:     {value: 35000, units: ft}
  reserve_range: {value: 200, units: nmi}
  reserve|h0:    {value: 15000, units: ft}

  # -------------------- Per-phase speed and vertical speed --------------------
  climb.fltcond|Ueas:           {value: [230, 252], units: kn}
  climb.fltcond|vs:             {value: [2300, 400], units: ft/min}
  cruise.fltcond|Ueas:          {value: 252, units: kn}
  cruise.fltcond|vs:            {value: 0, units: ft/min}
  descent.fltcond|Ueas:         {value: [252, 250], units: kn}
  descent.fltcond|vs:           {value: [-1300, -800], units: ft/min}
  reserve_climb.fltcond|Ueas:   {value: 230, units: kn}
  reserve_climb.fltcond|vs:     {value: [3000, 2300], units: ft/min}
  reserve_cruise.fltcond|Ueas:  {value: 250, units: kn}
  reserve_cruise.fltcond|vs:    {value: 0, units: ft/min}
  reserve_descent.fltcond|Ueas: {value: 250, units: kn}
  reserve_descent.fltcond|vs:   {value: -800, units: ft/min}
  loiter.fltcond|Ueas:          {value: 250, units: kn}
  loiter.fltcond|vs:            {value: 0, units: ft/min}

  # -------------------- Solver starting points --------------------
  # The ground-roll phases integrate acceleration from a standstill, so their solver needs a
  # true-airspeed guess rather than a schedule. Maximum takeoff weight is an *output* the box
  # solves for; writing it here is choosing where Newton starts, not choosing the weight.
  v0v1.fltcond|Utrue: {value: 100, units: kn}
  v1vr.fltcond|Utrue: {value: 100, units: kn}
  v1v0.fltcond|Utrue: {value: 100, units: kn}
  ac|weights|MTOW:    {value: 50.0e3, units: kg}

# ---------------------------------------------------------------------------------------------
# Continuation
# ---------------------------------------------------------------------------------------------
# The design mission does not converge from a cold start. Each rung is converged in turn, so the
# solver enters the next from a converged neighbour. This is the ladder B738_sizing.py walks
# between its two `run_model()` calls, written as data rather than as statements.
continuation:
  - description: short range at low altitude, gentle descent
    initial_conditions:
      mission_range:      {value: 500, units: nmi}
      cruise|h0:          {value: 5000, units: ft}
      reserve_range:      {value: 100, units: nmi}
      reserve|h0:         {value: 1000, units: ft}
      descent.fltcond|vs: {value: -800, units: ft/min}

  - description: design range and altitude, still with the gentle descent
    initial_conditions:
      descent.fltcond|vs: {value: -800, units: ft/min}
