# Boeing 737-800 design mission: 2800 nmi with Part 25 reserves.
#
# The design profile is what the aircraft is sized for. The continuation schedule below it is
# how the Newton solver is walked up to that profile from a cold start -- it changes nothing
# about the answer, only whether the solver reaches it. Each step is applied on top of the
# design profile, so anything a step does not override is the design value.
#
# This reproduces the profile in OpenConcept's B738_sizing.py example, including its
# continuation sequence.

parameters:
  mission_range: {value: 2800, units: nmi}
  reserve_range: {value: 200, units: nmi}
  cruise|h0: {value: 35000, units: ft}
  reserve|h0: {value: 15000, units: ft}

# Two endpoints are interpolated linearly across the phase's nodes; a single value is held
# constant; a full-length list is used as given.
schedule:
  climb:
    Ueas: {value: [230, 252], units: kn}
    vs: {value: [2300, 400], units: ft/min}
  cruise:
    Ueas: {value: 252, units: kn}
    vs: {value: 0, units: ft/min}
  descent:
    Ueas: {value: [252, 250], units: kn}
    vs: {value: [-1300, -800], units: ft/min}
  reserve_climb:
    Ueas: {value: 230, units: kn}
    vs: {value: [3000, 2300], units: ft/min}
  reserve_cruise:
    Ueas: {value: 250, units: kn}
    vs: {value: 0, units: ft/min}
  reserve_descent:
    Ueas: {value: 250, units: kn}
    vs: {value: -800, units: ft/min}
  loiter:
    Ueas: {value: 250, units: kn}
    vs: {value: 0, units: ft/min}

takeoff_speed_guess: {value: 100, units: kn}

continuation:
  - description: short range at low altitude, shallow descent
    parameters:
      mission_range: {value: 500, units: nmi}
      reserve_range: {value: 100, units: nmi}
      cruise|h0: {value: 5000, units: ft}
      reserve|h0: {value: 1000, units: ft}
    schedule:
      descent:
        Ueas: {value: [252, 250], units: kn}
        vs: {value: -800, units: ft/min}

  - description: design range and altitude, descent rate still shallow
    schedule:
      descent:
        Ueas: {value: [252, 250], units: kn}
        vs: {value: -800, units: ft/min}
