# =============================================================================================
# Boeing 737-800 -- certification-driven design optimization
# =============================================================================================
# Minimizes fuel with reserves over the wing planform and the engine rating, subject to an
# explicit set of constraints. Same aeroplane and same mission as b738.yaml: the only
# differences are the `optimize:` entries on five design variables, and the `driver`,
# `constraints` and `objective` blocks at the end.
#
# The layout follows OpenConcept's own B738 run scripts block for block:
#
#   design_variables   <- B738.py's `dv_comp.add_output_from_dict(...)` block, whose comment
#                         reads "Define a bunch of design variables and airplane-specific
#                         parameters". Add an `optimize:` entry to free one for a driver.
#   initial_conditions <- B738.py's `set_values(prob, num_nodes)`, using the same names.
#   continuation       <- the two `run_model()` calls inside B738_sizing.py's
#                         `set_mission_profile(prob)`, which converge an easy mission first.
#
# Every number is transcribed from openconcept/examples/aircraft_data/B738_sizing.py, so this
# case reproduces the reference example exactly. tests/test_validation.py runs it and compares.
# =============================================================================================

black_box:
  model: openconcept.examples.B738_sizing:B738SizingMissionAnalysis
  num_nodes: 11          # must be odd: the box integrates fuel burn with Simpson's rule

solver:
  maxiter: 50            # an optimizer visits designs a human would not
  atol: 1.0e-9
  rtol: 1.0e-9
  iprint: -1
  err_on_non_converge: true

# ---------------------------------------------------------------------------------------------
# Design variables
# ---------------------------------------------------------------------------------------------
# Every ac| variable the box publishes, with its value and where the number came from. None is
# freed here: this is a sizing run. See b738_optimization.yaml for the same aeroplane with
# `optimize:` entries added.
design_variables:

  # -------------------- Aerodynamics --------------------
  ac|aero|polar|e:
    value: 0.801
    source: OpenConcept B738 example estimate
  ac|aero|Mach_max:
    value: 0.82
    source: Boeing 737-800 maximum operating Mach
  ac|aero|Vstall_land:
    value: 115
    units: kn
    source: OpenConcept B738_sizing estimate
  ac|aero|airfoil_Cl_max:
    value: 1.75
    source: OpenConcept B738_sizing estimate for a supercritical airfoil
  ac|aero|takeoff_flap_deg:
    value: 15
    units: deg
    source: Boeing 737-800 normal takeoff flap setting

  # -------------------- Propulsion --------------------
  ac|propulsion|engine|rating:
    value: 27.0e3
    units: lbf
    source: CFM56-7B27 sea-level static thrust
    optimize: {lower: 18.0e3, upper: 34.0e3}
  ac|propulsion|num_engines:
    value: 2
    source: Boeing 737-800 configuration

  # -------------------- Wing --------------------
  ac|geom|wing|S_ref:
    value: 124.6
    units: m**2
    source: b737.org.uk technical specifications
    optimize: {lower: 90.0, upper: 180.0}
  ac|geom|wing|AR:
    value: 9.45
    source: b737.org.uk technical specifications
    optimize: {lower: 7.0, upper: 13.0}
  ac|geom|wing|c4sweep:
    value: 25
    units: deg
    source: b737.org.uk technical specifications
    optimize: {lower: 15.0, upper: 32.0}
  ac|geom|wing|taper:
    value: 0.159
    source: b737.org.uk technical specifications
    optimize: {lower: 0.12, upper: 0.35}
  ac|geom|wing|toverc:
    value: 0.12
    source: OpenConcept B738_sizing estimate

  # -------------------- Horizontal stabilizer --------------------
  # Its area is absent on purpose: the box sizes it from the tail volume coefficient.
  ac|geom|hstab|AR:
    value: 6.16
    source: b737.org.uk technical specifications
  ac|geom|hstab|c4sweep:
    value: 30
    units: deg
    source: b737.org.uk technical specifications
  ac|geom|hstab|taper:
    value: 0.203
    source: b737.org.uk technical specifications
  ac|geom|hstab|toverc:
    value: 0.12
    source: OpenConcept B738_sizing estimate

  # -------------------- Vertical stabilizer --------------------
  ac|geom|vstab|AR:
    value: 1.91
    source: b737.org.uk technical specifications
  ac|geom|vstab|c4sweep:
    value: 35
    units: deg
    source: b737.org.uk technical specifications
  ac|geom|vstab|taper:
    value: 0.271
    source: b737.org.uk technical specifications
  ac|geom|vstab|toverc:
    value: 0.12
    source: OpenConcept B738_sizing estimate

  # -------------------- Fuselage --------------------
  ac|geom|fuselage|length:
    value: 38.08
    units: m
    source: b737.org.uk technical specifications
  ac|geom|fuselage|height:
    value: 3.76
    units: m
    source: b737.org.uk technical specifications

  # -------------------- Nacelle --------------------
  ac|geom|nacelle|length:
    value: 4.3
    units: m
    source: OpenConcept B738_sizing photogrammetry estimate
  ac|geom|nacelle|diameter:
    value: 2
    units: m
    source: OpenConcept B738_sizing photogrammetry estimate

  # -------------------- Landing gear --------------------
  ac|geom|maingear|length:
    value: 1.8
    units: m
    source: OpenConcept B738_sizing estimate
  ac|geom|maingear|num_wheels:
    value: 4
    source: Boeing 737-800 configuration
  ac|geom|maingear|num_shock_struts:
    value: 2
    source: Boeing 737-800 configuration
  ac|geom|nosegear|length:
    value: 1.3
    units: m
    source: OpenConcept B738_sizing estimate
  ac|geom|nosegear|num_wheels:
    value: 2
    source: Boeing 737-800 configuration

  # -------------------- Weights, cabin and occupancy --------------------
  ac|weights|W_payload:
    value: 18.0e3
    units: kg
    source: OpenConcept B738_sizing design payload
  ac|num_passengers_max:
    value: 189
    source: Boeing 737-800 single-class maximum
  ac|num_flight_deck_crew:
    value: 2
    source: Boeing 737-800 configuration
  ac|num_cabin_crew:
    value: 4
    source: Boeing 737-800 configuration
  ac|cabin_pressure:
    value: 8.95
    units: psi
    source: Boeing 737-800 cabin differential

# ---------------------------------------------------------------------------------------------
# Initial conditions
# ---------------------------------------------------------------------------------------------
# The direct counterpart of `set_values(prob, num_nodes)`, with the same names. A two-element
# value is interpolated across the phase, exactly as `np.linspace(2300.0, 400.0, num_nodes)`
# does there; a single value is constant; a full-length list is used as given.
initial_conditions:

  # -------------------- Mission-level --------------------
  mission_range: {value: 2800, units: nmi}
  cruise|h0:     {value: 35000, units: ft}
  reserve_range: {value: 200, units: nmi}
  reserve|h0:    {value: 15000, units: ft}

  # -------------------- Per-phase speed and vertical speed --------------------
  climb.fltcond|Ueas:           {value: [230, 252], units: kn}
  climb.fltcond|vs:             {value: [2300, 400], units: ft/min}
  cruise.fltcond|Ueas:          {value: 252, units: kn}
  cruise.fltcond|vs:            {value: 0, units: ft/min}
  descent.fltcond|Ueas:         {value: [252, 250], units: kn}
  descent.fltcond|vs:           {value: [-1300, -800], units: ft/min}
  reserve_climb.fltcond|Ueas:   {value: 230, units: kn}
  reserve_climb.fltcond|vs:     {value: [3000, 2300], units: ft/min}
  reserve_cruise.fltcond|Ueas:  {value: 250, units: kn}
  reserve_cruise.fltcond|vs:    {value: 0, units: ft/min}
  reserve_descent.fltcond|Ueas: {value: 250, units: kn}
  reserve_descent.fltcond|vs:   {value: -800, units: ft/min}
  loiter.fltcond|Ueas:          {value: 250, units: kn}
  loiter.fltcond|vs:            {value: 0, units: ft/min}

  # -------------------- Solver starting points --------------------
  # The ground-roll phases integrate acceleration from a standstill, so their solver needs a
  # true-airspeed guess rather than a schedule. Maximum takeoff weight is an *output* the box
  # solves for; writing it here is choosing where Newton starts, not choosing the weight.
  v0v1.fltcond|Utrue: {value: 100, units: kn}
  v1vr.fltcond|Utrue: {value: 100, units: kn}
  v1v0.fltcond|Utrue: {value: 100, units: kn}
  ac|weights|MTOW:    {value: 50.0e3, units: kg}

# ---------------------------------------------------------------------------------------------
# Continuation
# ---------------------------------------------------------------------------------------------
# The design mission does not converge from a cold start. Each rung is converged in turn, so the
# solver enters the next from a converged neighbour. This is the ladder B738_sizing.py walks
# between its two `run_model()` calls, written as data rather than as statements.
continuation:
  - description: short range at low altitude, gentle descent
    initial_conditions:
      mission_range:      {value: 500, units: nmi}
      cruise|h0:          {value: 5000, units: ft}
      reserve_range:      {value: 100, units: nmi}
      reserve|h0:         {value: 1000, units: ft}
      descent.fltcond|vs: {value: -800, units: ft/min}

  - description: design range and altitude, still with the gentle descent
    initial_conditions:
      descent.fltcond|vs: {value: -800, units: ft/min}

# ---------------------------------------------------------------------------------------------
# Driver, constraints and objective
# ---------------------------------------------------------------------------------------------
# What OpenConcept's optimizing examples write as add_constraint / add_objective calls.

driver:
  # IPOPT through pyOptSparse, not SciPy's SLSQP, for a specific reason: the black box is a
  # Newton-solved implicit system, and an optimizer exploring a wide design space will
  # eventually propose a design it cannot converge. OpenMDAO's pyOptSparse driver catches that
  # and shortens its step; the SciPy driver re-raises, ending the run. SLSQP is supported and
  # is the default because it is always available.
  name: IPOPT
  maxiter: 40
  tol: 1.0e-6
  derivative_mode: fwd   # few design variables, many vector responses

constraints:
  # A constraint that names both a regulation and a source appears in the traceability matrix
  # as certification evidence. One that names neither is reported as a design constraint.
  - name: takeoff_field_length
    upper: 8000.0
    units: ft
    regulation: 14 CFR 25.113
    source: Design field length, 8000 ft dry runway at sea level, ISA
    title: Balanced field length within the runway available

  - name: engine_out_climb_gradient
    lower: 0.024
    units: rad
    regulation: 14 CFR 25.121(b)(1)(i)
    source: Two-engine aeroplane, 2.4% second-segment minimum
    title: OEI second-segment climb gradient

  # Two-sided bands, written exactly as B738_aerostructural.py writes them:
  #   prob.model.add_constraint("climb.throttle", lower=0.01, upper=1.05)
  - name: climb_throttle
    lower: 0.01
    upper: 1.05
    title: Climb throttle within the engine deck

  - name: cruise_throttle
    lower: 0.01
    upper: 1.05
    title: Cruise throttle within the engine deck

objective:
  # Fuel with reserves, not block fuel: sizing on block fuel designs an aeroplane that carries
  # no diversion. `ref` scales it to order one, which SLSQP needs and IPOPT does not.
  name: total_fuel
  units: kg
  sense: minimize
  ref: 2.0e4
