# Boeing 737-800 design parameters.
#
# Every entry here is an *independent* parameter: something chosen, not something the model
# computes. Quantities cdadt derives -- tail areas, wing MAC, wetted areas, OEW, MLW, MTOW,
# maximum lift coefficients -- are deliberately absent. Declaring one of them here would
# create the variable twice and OpenMDAO would reject the model.
#
# Sources, following OpenConcept's own B738 sizing data file:
#   - http://www.b737.org.uk/techspecsdetailed.htm
#   - https://en.wikipedia.org/wiki/Boeing_737#Specifications
#   - OpenConcept's B738 model
ac:
  # ==============================================================================
  # Aerodynamics
  # ==============================================================================
  aero:
    polar:
      e: {value: 0.801}              # span efficiency, estimated from the B738 example
    Mach_max: {value: 0.82}
    Vstall_land: {value: 115, units: kn}
    airfoil_Cl_max: {value: 1.75}    # estimate for a supercritical section
    takeoff_flap_deg: {value: 15, units: deg}
    # Read only by the approach-speed requirement, which flies a landing the mission does not.
    landing_flap_deg: {value: 40, units: deg}

  # ==============================================================================
  # Propulsion
  # ==============================================================================
  propulsion:
    engine:
      rating: {value: 27000, units: lbf}
    num_engines: {value: 2}

  # ==============================================================================
  # Geometry
  # ==============================================================================
  geom:
    wing:
      S_ref: {value: 124.6, units: m**2}
      AR: {value: 9.45}
      c4sweep: {value: 25, units: deg}
      taper: {value: 0.159}
      toverc: {value: 0.12}
    hstab:                            # S_ref is sized by tail volume coefficient
      AR: {value: 6.16}
      c4sweep: {value: 30, units: deg}
      taper: {value: 0.203}
      toverc: {value: 0.12}
    vstab:                            # S_ref is sized by tail volume coefficient
      AR: {value: 1.91}
      c4sweep: {value: 35, units: deg}
      taper: {value: 0.271}
      toverc: {value: 0.12}
    fuselage:
      length: {value: 38.08, units: m}
      height: {value: 3.76, units: m}
    nacelle:
      length: {value: 4.3, units: m}
      diameter: {value: 2, units: m}
    maingear:
      length: {value: 1.8, units: m}
      num_wheels: {value: 4}
      num_shock_struts: {value: 2}
    nosegear:
      length: {value: 1.3, units: m}
      num_wheels: {value: 2}

  # ==============================================================================
  # Weights
  # ==============================================================================
  weights:
    W_payload: {value: 18000, units: kg}

  # ==============================================================================
  # Cabin
  # ==============================================================================
  num_passengers_max: {value: 189}
  num_flight_deck_crew: {value: 2}
  num_cabin_crew: {value: 4}
  cabin_pressure: {value: 8.95, units: psi}
