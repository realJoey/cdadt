# The gates, run on GitHub's machines rather than on trust.
#
# Two jobs, because the suite divides very unevenly and pretending otherwise makes every push
# expensive. Measured on this repository:
#
#   unit + contract            253 tests    ~12 s    no conda, no compiled solver
#   integration + verification + validation + slow
#                              124 tests    ~24 min  converges real missions, runs IPOPT
#
# Two thirds of the tests cost about a thousandth of the time. So `quick` runs on every push, on
# any branch, and is meant to come back before you have switched windows. `full` is the real
# gate -- every test, the 100% coverage threshold, and the documentation build -- and runs where
# the result is actually load-bearing: `main`, pull requests, and on request.
#
# What `quick` cannot do is stand in for `full`. It excludes the tests that converge a mission,
# so it cannot enforce the coverage threshold, and a green `quick` is a statement about the fast
# tests only. The badge tracks `main`, where both run.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
  # Weekly, so rot is found by the schedule rather than by whoever pushes next. Nothing in this
  # repository changes between Sunday runs -- but conda's solver, PyPI, the GitHub runner image
  # and three pinned upstream clones all can, and a suite that passes only until the world moves
  # underneath it is worth knowing about before it blocks a commit.
  schedule:
    - cron: "0 6 * * 0"

# A superseded run tells nobody anything, and Actions minutes on a private repository come out of
# a monthly allowance.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    name: quick
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out cdadt
        uses: actions/checkout@v7

      - name: Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install what the fast tests actually need
        # Deliberately pip and not conda. The fast tests never reach pyOptSparse, IPOPT, JAX or a
        # vortex lattice, so none of the compiled stack has to exist for them -- which is the
        # whole reason this job can finish in a couple of minutes. numpy is held below 2 for the
        # same reason as everywhere else: OpenConcept requires it, and installing OpenConcept
        # --no-deps means pip will not enforce that bound for us.
        #
        # matplotlib is not optional here despite being an extra: three artefact tests draw real
        # figures, and without it they fail rather than skip.
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy<2" scipy openmdao pyyaml matplotlib pytest black ruff
          python -m pip install sphinx sphinx_rtd_theme
          git clone --depth 1 https://github.com/mdolab/openconcept.git ../openconcept
          git -C ../openconcept fetch --depth 1 origin 0d2adeb6f6855b3cbe77b1c1453c5cf22c7fe5ca
          git -C ../openconcept checkout 0d2adeb6f6855b3cbe77b1c1453c5cf22c7fe5ca
          python -m pip install -e ../openconcept --no-deps
          python -m pip install -e . --no-deps

      - name: black
        run: black --check .

      - name: ruff
        run: ruff check .

      - name: The fast tests
        # 14 of these skip without openavl and OpenAeroStruct, which this job does not install.
        # `full` is where they run.
        #
        # `python -m pytest`, not bare `pytest`. The `-m` form puts the working directory on
        # sys.path; the console script does not, and three test modules import `tests.conftest`
        # by name. Bare `pytest` fails collection on them with "No module named 'tests'". This is
        # also how the suite is run everywhere else -- locally, in docs/developing.rst, and in
        # `full` via `coverage run -m pytest`, which takes the same path.
        run: python -m pytest -m "unit or contract" -q

      - name: Build the documentation site
        # autodoc imports cdadt, which imports OpenConcept -- already installed above. It does not
        # need openavl or OpenAeroStruct: both are imported lazily, behind an availability probe.
        run: python -m sphinx -W -b html docs docs/_build/html

      - name: Publish the documentation site
        # cdadt is a private repository, so GitHub Pages is not available to it -- Pages on a
        # private repository requires Pro or Team, and the sibling penguino repository is the
        # worked example of what happens otherwise: its Pages deployment has failed on every
        # recent run and no site was ever produced.
        #
        # An artifact has no such restriction. The whole rendered site -- API reference, the XDSM
        # figures, docs/truth.rst -- is downloadable from the run page for 90 days. That is a
        # smaller thing than a URL, but it is a real one, whereas a Pages job here would be a
        # permanently red check that published nothing.
        #
        # If this repository ever becomes public, the change is small and local: swap this step
        # for `actions/upload-pages-artifact` and add a deploy job. The build above is already
        # exactly what Pages would serve.
        uses: actions/upload-artifact@v7
        with:
          name: documentation
          path: docs/_build/html
          retention-days: 90

  full:
    name: full
    # Skipped on a branch push; `quick` is what guards those. Note that `always run on a pull
    # request` is the point -- it means nothing reaches main without having passed this.
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    # The suite takes ~25 minutes on a fast desktop and a cloud runner is slower on the
    # single-threaded Newton solves that dominate it. The ceiling is set well above the expected
    # hour-and-a-quarter rather than close to it: killing a run that was going to pass wastes
    # everything it had already done and reports red for it. It exists only so a wedged job
    # cannot burn GitHub's six-hour default.
    timeout-minutes: 150
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Check out cdadt
        uses: actions/checkout@v7

      - name: Cache the conda packages
        # Solving ~200 pinned packages is the slowest step that is not the suite itself, and it
        # produces the same answer every time, so it is cached against the file that determines
        # it. An explicit drive path rather than `~`: that is the pattern setup-miniconda
        # documents for Windows runners.
        uses: actions/cache@v6
        with:
          path: 'D:\conda_pkgs_dir'
          key: conda-${{ runner.os }}-${{ hashFiles('environment.yml') }}

      - name: Build cdadt_env from the environment specification
        # Windows, and that is not a preference. `environment.yml` is an exact export of a
        # validated Windows environment: it names `vc14_runtime`, `ucrt`, `win_inet_pton` and
        # `pyside6`, none of which exist for linux-64, so conda cannot solve it there. Running
        # Linux would mean a second environment specification -- a second thing to keep true --
        # and would lose the one constraint that file documents as load-bearing precisely on
        # Windows: the `=*openblas` build selectors on libblas/libcblas/liblapack, without which
        # NumPy aborts the interpreter inside `numpy.linalg.solve`, which OpenConcept calls at
        # import. This job proving that pin still holds is worth the runner.
        uses: conda-incubator/setup-miniconda@v4
        with:
          environment-file: environment.yml
          activate-environment: cdadt_env
          miniforge-version: latest
          use-mamba: true
          pkgs-dirs: 'D:\conda_pkgs_dir'

      - name: Clone the dependencies, at the commits cdadt is validated against
        # Pinned rather than tracked. The validation tests assert agreement with OpenConcept's
        # own published example to 1e-6, so following upstream would let a commit in somebody
        # else's repository turn this badge red with no change here. Bumping a pin is a
        # deliberate act, and it comes with revalidating the numbers in docs/validation.rst.
        run: |
          git clone https://github.com/mdolab/openconcept.git ../openconcept
          git -C ../openconcept checkout 0d2adeb6f6855b3cbe77b1c1453c5cf22c7fe5ca
          git clone https://github.com/mdolab/OpenAeroStruct.git ../OpenAeroStruct
          git -C ../OpenAeroStruct checkout 0a4d614f9494cbadaba4a6fa32a33d6e54e14f34
          git clone https://github.com/danielenriquez59/openavl.git ../openavl
          git -C ../openavl checkout 647d556abd3d51b57cf5c80bc020a248e5e7d4b5

      - name: Install OpenConcept
        # --no-deps, or pip acts on OpenConcept's declared numpy<2 bound and downgrades the
        # conda-forge stack this environment was solved for. See docs/install.rst.
        run: pip install -e ../openconcept --no-deps

      - name: Install openavl and its JAX
        # Pinned to the versions the environment was validated with rather than the `<0.5` the
        # extra declares, so CI and a developer's machine resolve the same solver. openavl itself
        # is --no-deps: it declares numpy>=2.4, which would undo the pin above.
        run: |
          pip install "jax==0.4.38" "jaxlib==0.4.38"
          pip install -e ../openavl --no-deps

      - name: Install OpenAeroStruct
        # With dependencies, unlike the other two: every requirement is a floor numpy 1.26
        # already satisfies.
        run: pip install -e ../OpenAeroStruct

      - name: Install cdadt
        # --no-deps so the conda-provided black, ruff, pytest and sphinx are the ones that run.
        # Letting pip resolve the dev extra would install its own black, and a black that differs
        # from the developer's formats different files -- CI and local would then disagree about
        # a gate whose whole purpose is to end that disagreement.
        run: pip install -e . --no-deps

      - name: Report what is actually installed
        # The run log should be able to answer "what was this green tick measured against?"
        # without anyone re-deriving it. If either optional dependency is missing, the tests that
        # need it skip, coverage falls, and the coverage step below fails -- so this is also the
        # first place to look when it does.
        run: |
          python -c "import numpy, openmdao, cdadt; print('cdadt', cdadt.__version__, '| numpy', numpy.__version__, '| openmdao', openmdao.__version__)"
          # The BLAS, because environment.yml pins `=*openblas` and calls that pin load-bearing.
          # When a converged result differed between a developer machine and this runner by 3e-6,
          # the linear algebra was a prime suspect and nothing in the log could confirm or clear
          # it. One line here means the next such difference starts with evidence.
          conda list "libblas|libcblas|liblapack|libopenblas|mkl" || true
          python -c "from cdadt.adapter.avl import openavl_is_available; print('openavl available:', openavl_is_available())"
          python -c "from cdadt.adapter.oas import openaerostruct_is_available; print('OpenAeroStruct available:', openaerostruct_is_available())"

      - name: black
        run: black --check .

      - name: ruff
        run: ruff check .

      - name: The full suite, under coverage
        # `coverage report` exits non-zero below fail_under = 100, so this step is what the
        # coverage badge stands on. A partial run must not be able to report itself as a pass.
        run: |
          coverage run -m pytest -q
          coverage report

      - name: sphinx -W
        run: python -m sphinx -W -b html docs docs/_build/html
