# Keep the things this repository pins from going quietly stale.
#
# This is here in place of GitHub's dependency-review action, which needs the dependency graph.
# That was unavailable when this repository was private; the repository is public now, but the
# graph still is not there -- /repos/realJoey/cdadt/dependency-graph/sbom answered 404 on
# 2026-08-03 while the same call against public mdolab/openconcept returned a populated SBOM. So
# the action remains something to add once the graph exists, not before.
#
# Dependabot *version* updates never needed the graph, and they address the failure that actually
# happened here -- the CI workflow was first written against actions/checkout@v4, actions/cache@v4
# and setup-miniconda@v3 while the current majors were v7, v6 and v4. Nothing would have said so.
#
# Deliberately not covering the three research dependencies. OpenConcept, OpenAeroStruct and
# openavl are pinned to exact commits in ci.yml because the validation tests assert agreement with
# OpenConcept's published example to 1e-6; a bot bumping those would be proposing to invalidate
# published numbers, which is a decision that belongs to whoever re-runs them.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      # The repository's own convention: imperative, and no tooling prefix noise.
      prefix: "Update"

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "Update"
    ignore:
      # numpy is held below 2 across the whole stack: OpenConcept requires it, and on Windows the
      # openblas-backed build is what keeps NumPy from aborting the interpreter inside
      # numpy.linalg.solve. A major bump here is an environment migration, not a dependency
      # update. See docs/install.rst and environment.yml.
      - dependency-name: numpy
        update-types: ["version-update:semver-major"]
      # jax and jaxlib are the same constraint wearing a different name. The `avl` extra declares
      # `jax<0.5` not because 0.5 is untested but because jax 0.6+ requires numpy>=2, so that
      # bound is what holds numpy down -- a ceiling, not a lag. Ignoring only numpy above missed
      # this, and Dependabot duly proposed <0.5 -> <0.7 in #2 and #3, both closed.
      #
      # Those two PRs also passed CI, which is worth knowing rather than reassuring: ci.yml
      # installs `jax==0.4.38 jaxlib==0.4.38` explicitly, so widening the declared bound changes
      # nothing about what the runner installs and the gate cannot see the breakage. Raising
      # these is an environment migration, done deliberately with environment.yml, not a
      # dependency update to be reviewed on a green tick.
      - dependency-name: jax
      - dependency-name: jaxlib
