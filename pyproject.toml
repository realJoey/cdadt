[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cdadt"
version = "0.2.0"
description = "A certification-driven aircraft design tool that drives OpenConcept full-mission sizing as a black box"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "Joey Gould" }]
keywords = [
    "aircraft design",
    "certification",
    "multidisciplinary design optimization",
    "openmdao",
    "openconcept",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

# NOTE: openconcept is deliberately NOT listed here. It is installed separately with
# ``pip install -e <path to clone> --no-deps`` so that pip never acts on openconcept's
# declared numpy<2 bound and downgrades the conda-forge stack in cdadt_env. See
# docs/install.rst for the full rationale.
dependencies = [
    "numpy",
    "scipy",
    "openmdao>=3.21",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "black", "ruff"]
docs = ["sphinx", "sphinx_rtd_theme", "numpydoc"]
plot = ["matplotlib"]

[project.scripts]
cdadt = "cdadt.cli:main"

[project.urls]
Repository = "https://github.com/realJoey/cdadt"

[tool.setuptools.packages.find]
include = ["cdadt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Every test declares what class of claim it makes, so that "the suite passes" can be read as
# a statement about what has actually been established.
markers = [
    "unit: exercises one cdadt class in isolation, with no OpenMDAO model",
    "contract: checks the cdadt <-> OpenConcept boundary itself",
    "integration: builds and converges a real OpenConcept model",
    "verification: establishes that the equations are solved right -- grid convergence, derivative accuracy, solver tolerance, reproducibility",
    "validation: establishes that the right equations were solved -- against an external reference that is run, or against physical reality",
    "slow: takes minutes; excluded from the fast loop",
]
addopts = "--strict-markers"

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Explicit rather than inherited: ruff's default set changes between releases, and a lint
# configuration that shifts under the code is worse than a narrow one.
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    # Sphinx cross-references in docstrings routinely exceed the formatter's reach; the
    # formatter owns line length for code.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately assert on broad exception types when the property under test is
# "this raises", regardless of which exception type the implementation chooses.
"tests/*" = ["B017"]

[tool.coverage.run]
source = ["cdadt"]
branch = true

[tool.coverage.report]
# The package is at 100% statement and branch coverage, and stays there. Every line of cdadt is
# reachable from a test: there is no physics here to be hard to exercise, only interface,
# validation and reporting, so anything unreachable is either dead or a missing test.
# Deliberately no `exclude_lines` beyond coverage's default `# pragma: no cover`, which nothing
# currently uses -- an exclusion list is how a coverage number stops meaning anything.
fail_under = 100
show_missing = true
skip_covered = true
