[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cdadt"
version = "0.1.0"
description = "A Certification Driven Aircraft Design Tool"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "Joey Gould" }]
keywords = [
    "aircraft design",
    "certification",
    "multidisciplinary optimization",
    "openmdao",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

# NOTE: openconcept is deliberately NOT listed here. It is installed separately with
# ``pip install -e <path to clone> --no-deps`` so that pip never acts on openconcept's
# declared numpy<2 bound and downgrades the conda-forge stack in cdadt_env. See
# docs/install.rst for the full rationale.
dependencies = [
    "numpy",
    "scipy",
    "openmdao>=3.21",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "packaging",
    "black",
    "ruff",
]
docs = [
    "sphinx",
    "sphinx_mdolab_theme",
    "numpydoc",
]
plot = ["matplotlib"]

[project.urls]
Repository = "https://github.com/realJoey/cdadt"

[tool.setuptools.packages.find]
include = ["cdadt*"]

[tool.pytest.ini_options]
testpaths = ["cdadt/tests"]
markers = [
    "unit: exercises a single cdadt class in isolation",
    "contract: verifies the cdadt <-> OpenConcept interface contract",
    "derivative: verifies analytic partials/totals against complex step",
    "integration: builds and runs an assembled multi-discipline model",
    "validation: compares cdadt results against an external reference or hand calculation",
    "regression: pins a previously converged result against drift",
    "slow: takes more than a few seconds; excluded from the fast loop",
]
addopts = "--strict-markers"

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.ruff]
line-length = 120

[tool.coverage.run]
source = ["cdadt"]
omit = ["cdadt/tests/*"]
