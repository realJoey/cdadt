# Boeing 737-800 configuration for cdadt.
#
# Design values are transcribed from OpenConcept's own B738_sizing example data
# (openconcept/examples/aircraft_data/B738_sizing.py), so that cdadt results can be
# validated against that reference implementation directly. That file cites:
#   - http://www.b737.org.uk/techspecsdetailed.htm
#   - https://en.wikipedia.org/wiki/Boeing_737#Specifications
#   - the OpenConcept B738 model
#
# Entries marked "no default in cdadt" are method constants for which OpenConcept supplies
# a built-in default. cdadt requires them explicitly: a default drawn from a reference is
# still a number applied to a configuration that never mentioned it, and a result computed
# from one is a result nobody chose. The `source` field is what the run report cites.

ac:
  # ============================================================================
  # Aerodynamics
  # ============================================================================
  aero:
    polar:
      e:
        value: 0.801
        source: "OpenConcept B738 example estimate"
    Mach_max:
      value: 0.82
    Vstall_land:
      value: 115
      units: kn
      source: "OpenConcept B738_sizing estimate"
    airfoil_Cl_max:
      value: 1.75
      source: "OpenConcept B738_sizing estimate for a supercritical airfoil"
    takeoff_flap_deg:
      value: 15
      units: deg

  # ============================================================================
  # Propulsion
  # ============================================================================
  propulsion:
    engine:
      rating:
        value: 27000.0
        units: lbf
    num_engines:
      value: 2

  # ============================================================================
  # Geometry
  # ============================================================================
  geom:
    wing:
      S_ref:
        value: 124.6
        units: m**2
      AR:
        value: 9.45
      c4sweep:
        value: 25
        units: deg
      taper:
        value: 0.159
      toverc:
        value: 0.12
        source: "OpenConcept B738_sizing estimate"

    hstab:
      AR:
        value: 6.16
      c4sweep:
        value: 30
        units: deg
      taper:
        value: 0.203
      toverc:
        value: 0.12
        source: "OpenConcept B738_sizing guess"
      # S_ref is not given: it is sized by the tail volume coefficient method.
      volume_coefficient:
        value: 1.00
        source: >-
          Raymer, Aircraft Design: A Conceptual Approach, 1992, Table 6.4, jet transport.
          No default in cdadt; OpenConcept uses this same value as an option default.
      arm_fraction_of_fuselage:
        value: 0.5
        source: >-
          Wing quarter chord to tail quarter chord estimated as half the fuselage length,
          matching OpenConcept's B738_sizing example. No default in cdadt.

    vstab:
      AR:
        value: 1.91
      c4sweep:
        value: 35
        units: deg
      taper:
        value: 0.271
      toverc:
        value: 0.12
        source: "OpenConcept B738_sizing guess"
      volume_coefficient:
        value: 0.09
        source: >-
          Raymer, Aircraft Design: A Conceptual Approach, 1992, Table 6.4, jet transport.
          No default in cdadt; OpenConcept uses this same value as an option default.
      arm_fraction_of_fuselage:
        value: 0.5
        source: >-
          Wing quarter chord to tail quarter chord estimated as half the fuselage length,
          matching OpenConcept's B738_sizing example. No default in cdadt.

    fuselage:
      length:
        value: 38.08
        units: m
      height:
        value: 3.76
        units: m

    nacelle:
      length:
        value: 4.3
        units: m
        source: "OpenConcept B738_sizing photogrammetry estimate"
      diameter:
        value: 2.0
        units: m
        source: "OpenConcept B738_sizing photogrammetry estimate"

    maingear:
      length:
        value: 1.8
        units: m
      num_wheels:
        value: 4
      num_shock_struts:
        value: 2

    nosegear:
      length:
        value: 1.3
        units: m
      num_wheels:
        value: 2

  # ============================================================================
  # Weights
  # ============================================================================
  weights:
    W_payload:
      value: 18000.0
      units: kg

    # MTOW and maximum fuel are *solved* by the sizing loop, not specified. The values here
    # are the starting point the Newton solver is given. They are configured rather than
    # built in because a starting point that is wrong by an order of magnitude decides
    # whether the mission converges at all, so it belongs with the case, not in the code.
    MTOW:
      value: 50000.0
      units: kg
      source: >-
        Initial guess for the sizing loop, matching OpenConcept's B738_sizing example.
        Overwritten by MTOW = OEW + payload + fuel once the loop converges.
    W_fuel_max:
      value: 30000.0
      units: kg
      source: >-
        Initial guess for the sizing loop, matching OpenConcept's B738_sizing example.
        Overwritten by the mission's total fuel burn once the loop converges.
    MLW_fraction_of_MTOW:
      value: 0.8
      source: >-
        Maximum landing mass estimated as 80% of maximum takeoff mass, matching
        OpenConcept's B738_sizing example. Feeds only the landing gear weight estimate.
        No default in cdadt.

  # ============================================================================
  # Miscellaneous
  # ============================================================================
  num_passengers_max:
    value: 189
  num_flight_deck_crew:
    value: 2
  num_cabin_crew:
    value: 4
  cabin_pressure:
    value: 8.95
    units: psi
