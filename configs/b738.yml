# Boeing 737-800 configuration for cdadt.
#
# Design values are transcribed from OpenConcept's own B738_sizing example data
# (openconcept/examples/aircraft_data/B738_sizing.py), so that cdadt results can be
# validated against that reference implementation directly. That file cites:
#   - http://www.b737.org.uk/techspecsdetailed.htm
#   - https://en.wikipedia.org/wiki/Boeing_737#Specifications
#   - the OpenConcept B738 model
#
# Entries marked "no default in cdadt" are method constants for which OpenConcept supplies
# a built-in default. cdadt requires them explicitly: a default drawn from a reference is
# still a number applied to a configuration that never mentioned it, and a result computed
# from one is a result nobody chose. The `source` field is what the run report cites.

ac:
  # ============================================================================
  # Aerodynamics
  # ============================================================================
  aero:
    polar:
      e:
        value: 0.801
        source: "OpenConcept B738 example estimate"
    Mach_max:
      value: 0.82
    Vstall_land:
      value: 115
      units: kn
      source: "OpenConcept B738_sizing estimate"
    airfoil_Cl_max:
      value: 1.75
      source: "OpenConcept B738_sizing estimate for a supercritical airfoil"
    takeoff_flap_deg:
      value: 15
      units: deg
    landing_flap_deg:
      value: 40
      units: deg
      source: "Boeing 737-800 maximum landing flap setting"

  # ============================================================================
  # Propulsion
  # ============================================================================
  propulsion:
    engine:
      rating:
        value: 27000.0
        units: lbf
    num_engines:
      value: 2

  # ============================================================================
  # Geometry
  # ============================================================================
  geom:
    wing:
      S_ref:
        value: 124.6
        units: m**2
      AR:
        value: 9.45
      c4sweep:
        value: 25
        units: deg
      taper:
        value: 0.159
      toverc:
        value: 0.12
        source: "OpenConcept B738_sizing estimate"

    hstab:
      AR:
        value: 6.16
      c4sweep:
        value: 30
        units: deg
      taper:
        value: 0.203
      toverc:
        value: 0.12
        source: "OpenConcept B738_sizing guess"
      # S_ref is not given: it is sized by the tail volume coefficient method.
      volume_coefficient:
        value: 1.00
        source: >-
          Raymer, Aircraft Design: A Conceptual Approach, 1992, Table 6.4, jet transport.
          No default in cdadt; OpenConcept uses this same value as an option default.
      arm_fraction_of_fuselage:
        value: 0.5
        source: >-
          Wing quarter chord to tail quarter chord estimated as half the fuselage length,
          matching OpenConcept's B738_sizing example. No default in cdadt.

    vstab:
      AR:
        value: 1.91
      c4sweep:
        value: 35
        units: deg
      taper:
        value: 0.271
      toverc:
        value: 0.12
        source: "OpenConcept B738_sizing guess"
      volume_coefficient:
        value: 0.09
        source: >-
          Raymer, Aircraft Design: A Conceptual Approach, 1992, Table 6.4, jet transport.
          No default in cdadt; OpenConcept uses this same value as an option default.
      arm_fraction_of_fuselage:
        value: 0.5
        source: >-
          Wing quarter chord to tail quarter chord estimated as half the fuselage length,
          matching OpenConcept's B738_sizing example. No default in cdadt.

    fuselage:
      length:
        value: 38.08
        units: m
      height:
        value: 3.76
        units: m

    nacelle:
      length:
        value: 4.3
        units: m
        source: "OpenConcept B738_sizing photogrammetry estimate"
      diameter:
        value: 2.0
        units: m
        source: "OpenConcept B738_sizing photogrammetry estimate"

    maingear:
      length:
        value: 1.8
        units: m
      num_wheels:
        value: 4
      num_shock_struts:
        value: 2

    nosegear:
      length:
        value: 1.3
        units: m
      num_wheels:
        value: 2

  # ============================================================================
  # Weights
  # ============================================================================
  weights:
    W_payload:
      value: 18000.0
      units: kg

    # MTOW and maximum fuel are *solved* by the sizing loop, not specified. The values here
    # are the starting point the Newton solver is given. They are configured rather than
    # built in because a starting point that is wrong by an order of magnitude decides
    # whether the mission converges at all, so it belongs with the case, not in the code.
    MTOW:
      value: 50000.0
      units: kg
      source: >-
        Initial guess for the sizing loop, matching OpenConcept's B738_sizing example.
        Overwritten by MTOW = OEW + payload + fuel once the loop converges.
    W_fuel_max:
      value: 30000.0
      units: kg
      source: >-
        Initial guess for the sizing loop, matching OpenConcept's B738_sizing example.
        Overwritten by the mission's total fuel burn once the loop converges.
    MLW_fraction_of_MTOW:
      value: 0.8
      source: >-
        Maximum landing mass estimated as 80% of maximum takeoff mass, matching
        OpenConcept's B738_sizing example. Feeds only the landing gear weight estimate.
        No default in cdadt.

  # ============================================================================
  # Miscellaneous
  # ============================================================================
  num_passengers_max:
    value: 189
  num_flight_deck_crew:
    value: 2
  num_cabin_crew:
    value: 4
  cabin_pressure:
    value: 8.95
    units: psi

# ==============================================================================
# Mission
# ==============================================================================
# The mission is part of the case, not part of the code. Values match the profile
# OpenConcept's B738_sizing example flies, so cdadt results are comparable to that
# reference. Schedules give two endpoints and are interpolated across the analysis nodes,
# which keeps the profile independent of node count.
mission:
  # Nested to match the pipe-separated names OpenConcept uses: "takeoff|h" is
  # mission -> takeoff -> h.
  takeoff:
    h:
      value: 0.0
      units: ft
  cruise:
    h0:
      value: 35000.0
      units: ft
  reserve:
    h0:
      value: 15000.0
      units: ft
  loiter:
    h0:
      value: 1500.0
      units: ft
  mission_range:
    value: 2800.0
    units: nmi
  payload:
    value: 18000.0
    units: kg
  reserve_range:
    value: 200.0
    units: nmi
  loiter_duration:
    value: 1800.0
    units: s

  # Seed for the ground-roll true-airspeed vectors. These integrate acceleration from a
  # standstill and their solver is sensitive to the starting point.
  takeoff_speed_guess:
    value: 100.0
    units: kn

  schedule:
    climb:
      Ueas:
        value: [230.0, 252.0]
        units: kn
      vs:
        value: [2300.0, 400.0]
        units: ft/min
    cruise:
      Ueas:
        value: [252.0, 252.0]
        units: kn
      vs:
        value: [0.0, 0.0]
        units: ft/min
    descent:
      Ueas:
        value: [252.0, 250.0]
        units: kn
      vs:
        value: [-1300.0, -800.0]
        units: ft/min
    reserve_climb:
      Ueas:
        value: [230.0, 230.0]
        units: kn
      vs:
        value: [3000.0, 2300.0]
        units: ft/min
    reserve_cruise:
      Ueas:
        value: [250.0, 250.0]
        units: kn
      vs:
        value: [0.0, 0.0]
        units: ft/min
    reserve_descent:
      Ueas:
        value: [250.0, 250.0]
        units: kn
      vs:
        value: [-800.0, -800.0]
        units: ft/min
    loiter:
      Ueas:
        value: [250.0, 250.0]
        units: kn
      vs:
        value: [0.0, 0.0]
        units: ft/min

  # Continuation schedule. The mission is a coupled implicit system -- phase durations,
  # throttle and V1 are all solved -- and a Newton solver started at the design mission
  # does not converge. Each step is run in sorted key order, so the solver enters the next
  # from a converged neighbour. This mirrors the ramp OpenConcept's own B738_sizing example
  # performs at lines 472-490, made explicit so it can be inspected and tested.
  continuation:
    # Short range at low altitude, with a gentle constant descent. The steep initial
    # descent of the design profile is what the solver has most trouble with, so it is
    # introduced last.
    step_0_short_range_low_altitude:
      mission_range:
        value: 500.0
        units: nmi
      cruise:
        h0:
          value: 5000.0
          units: ft
      reserve:
        h0:
          value: 1000.0
          units: ft
      reserve_range:
        value: 100.0
        units: nmi
      schedule:
        descent:
          Ueas:
            value: [252.0, 250.0]
            units: kn
          vs:
            value: [-800.0, -800.0]
            units: ft/min

    # Design range and altitudes, still with the gentle descent.
    step_1_design_range_gentle_descent:
      mission_range:
        value: 2800.0
        units: nmi
      cruise:
        h0:
          value: 35000.0
          units: ft
      reserve:
        h0:
          value: 15000.0
          units: ft
      reserve_range:
        value: 200.0
        units: nmi
      schedule:
        descent:
          Ueas:
            value: [252.0, 250.0]
            units: kn
          vs:
            value: [-800.0, -800.0]
            units: ft/min

# ==============================================================================
# Certification basis
# ==============================================================================
# Every limit here comes from a regulation *and* an operating case. The regulation says
# what must be demonstrated; the case -- which runway, which altitude, which approach
# category -- says against what. cdadt requires both to be stated, so the traceability
# matrix can cite the limit as well as the rule.
certification:
  takeoff:
    field_length_available:
      value: 8000.0
      units: ft
      source: >-
        Design requirement: takeoff field length available at the critical airport,
        sea level ISA. 14 CFR 25.113 defines the distance; this is what it must fit in.

  climb:
    oei_second_segment_gradient:
      value: 0.024
      source: >-
        14 CFR 25.121(b): 2.4% steady gradient of climb at V2 with the critical engine
        inoperative, for two-engine aeroplanes. Three-engine is 2.7%, four-engine 3.0%.

  propulsion:
    throttle_max:
      value: 1.05
      source: >-
        Design constraint, not a regulation. Slightly above rated so a converging solver
        may pass through the boundary without the constraint chattering.

  landing:
    field_length_available:
      value: 7000.0
      units: ft
      source: >-
        Design requirement: landing field length available at the critical airport.

    approach_speed_max:
      value: 140.0
      units: kn
      source: >-
        Upper bound of approach category C (121-140 kn at maximum landing weight), which
        determines which approach procedures and airports the aircraft can use.

    approach_speed_factor:
      value: 1.23
      source: >-
        14 CFR 25.125(a)(2): V_REF must be at least 1.23 V_SR0. This is the regulatory
        floor; a higher value may be flown in practice.

    airborne_distance:
      value: 305.0
      units: m
      source: >-
        Distance flown from the 50 ft screen height to touchdown, at a 3 degree approach
        with a flare. Transport-category conceptual design value; depends on the
        procedure flown and is stated here rather than inferred.

    mean_deceleration:
      value: 3.0
      units: m/s**2
      source: >-
        Mean deceleration during the ground roll with wheel braking and spoilers on a dry
        runway, roughly 0.3 g. Depends on the braking system and runway condition.

    dispatch_factor:
      value: 0.6
      source: >-
        14 CFR 121.195(b): a turbine-powered transport may be dispatched only to an
        airport where it can land within 60% of the effective runway length. Wet-runway
        dispatch under 121.195(d) uses a different factor.

# ==============================================================================
# Solver
# ==============================================================================
# Numerical settings for the sizing loop. Configured rather than built in: tolerances
# decide when a result is called converged, so they belong with the case that reports it.
solver:
  maxiter:
    value: 20
  atol:
    value: 1.0e-9
  rtol:
    value: 1.0e-9
