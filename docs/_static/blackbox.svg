<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568"/>
    </marker>
  </defs>

  <!-- cdadt side -->
  <rect x="10" y="20" width="250" height="290" rx="8" fill="none" stroke="#2b6cb0" stroke-width="2"/>
  <text x="135" y="45" text-anchor="middle" font-size="15" font-weight="600" fill="#2b6cb0">cdadt</text>

  <rect x="30" y="62" width="210" height="46" rx="5" fill="#ebf4ff" stroke="#2b6cb0"/>
  <text x="135" y="82" text-anchor="middle" font-size="12" fill="#1a365d">Disciplines + Providers</text>
  <text x="135" y="98" text-anchor="middle" font-size="10.5" fill="#4a5568">aero · propulsion · weights · geometry</text>

  <rect x="30" y="124" width="210" height="40" rx="5" fill="#ebf4ff" stroke="#2b6cb0"/>
  <text x="135" y="149" text-anchor="middle" font-size="12" fill="#1a365d">AircraftModelFactory</text>

  <rect x="30" y="180" width="210" height="40" rx="5" fill="#ebf4ff" stroke="#2b6cb0"/>
  <text x="135" y="205" text-anchor="middle" font-size="12" fill="#1a365d">MissionBlackBox</text>

  <rect x="30" y="236" width="210" height="52" rx="5" fill="#ebf4ff" stroke="#2b6cb0"/>
  <text x="135" y="256" text-anchor="middle" font-size="12" fill="#1a365d">CertificationBasis</text>
  <text x="135" y="272" text-anchor="middle" font-size="10.5" fill="#4a5568">25.113 · 25.121 · 25.119/125</text>

  <!-- OpenConcept side -->
  <rect x="460" y="20" width="250" height="290" rx="8" fill="none" stroke="#276749" stroke-width="2"
        stroke-dasharray="6 4"/>
  <text x="585" y="45" text-anchor="middle" font-size="15" font-weight="600" fill="#276749">OpenConcept</text>
  <text x="585" y="61" text-anchor="middle" font-size="10.5" fill="#4a5568">read-only dependency</text>

  <rect x="480" y="76" width="210" height="212" rx="5" fill="#f0fff4" stroke="#276749"/>
  <text x="585" y="97" text-anchor="middle" font-size="12" fill="#22543d">FullMissionWithReserve</text>
  <text x="585" y="120" text-anchor="middle" font-size="10.5" fill="#4a5568">v0v1 · v1vr · v1v0 · rotate</text>
  <text x="585" y="138" text-anchor="middle" font-size="10.5" fill="#4a5568">engineoutclimb</text>
  <text x="585" y="156" text-anchor="middle" font-size="10.5" fill="#4a5568">climb · cruise · descent</text>
  <text x="585" y="174" text-anchor="middle" font-size="10.5" fill="#4a5568">reserve_climb · reserve_cruise</text>
  <text x="585" y="192" text-anchor="middle" font-size="10.5" fill="#4a5568">reserve_descent · loiter</text>
  <text x="585" y="220" text-anchor="middle" font-size="10.5" font-style="italic" fill="#276749">
    each phase constructs
  </text>
  <text x="585" y="236" text-anchor="middle" font-size="10.5" font-style="italic" fill="#276749">
    the supplied model class
  </text>
  <text x="585" y="266" text-anchor="middle" font-size="10.5" fill="#4a5568">12 callbacks per mission</text>

  <!-- arrows -->
  <line x1="262" y1="120" x2="456" y2="120" stroke="#4a5568" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="359" y="112" text-anchor="middle" font-size="11" fill="#2d3748">aircraft model class</text>

  <line x1="262" y1="170" x2="456" y2="170" stroke="#4a5568" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="359" y="162" text-anchor="middle" font-size="11" fill="#2d3748">mission profile, ac|*</text>

  <line x1="456" y1="215" x2="262" y2="215" stroke="#4a5568" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="359" y="207" text-anchor="middle" font-size="11" fill="#2d3748">fltcond|*, throttle</text>

  <line x1="456" y1="262" x2="262" y2="262" stroke="#4a5568" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="359" y="254" text-anchor="middle" font-size="11" fill="#2d3748">fuel, BFL, V1, gamma</text>

  <text x="359" y="300" text-anchor="middle" font-size="10.5" font-style="italic" fill="#718096">
    contract declared in cdadt/mission/contract.py
  </text>
</svg>
